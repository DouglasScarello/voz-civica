<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>voz-civica</title>
<style>
  :root {
    --bg: #0a0b0f;
    --fg: #e6e8ee;
    --fg-dim: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 28px;
  }
  canvas {
    display: block;
  }
  #label {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
    transition: color 0.4s ease;
  }
  #label.connected { color: var(--fg); }
  #disconnected-banner {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #3a1414;
    color: #ff8a8a;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #disconnected-banner.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <canvas id="orb" width="360" height="360"></canvas>
  <div id="label">conectando...</div>
</div>
<div id="disconnected-banner">desconectado — tentando reconectar</div>

<script>
const STATE_COLORS = {
  listening:    { r: 90,  g: 140, b: 255 },  // azul calmo
  speaking_user:{ r: 80,  g: 200, b: 255 },  // azul-ciano vivo
  thinking:     { r: 255, g: 176, b: 60  },  // âmbar
  speaking_ai:  { r: 90,  g: 230, b: 150 },  // verde
};

const STATE_LABELS = {
  listening: "ouvindo",
  speaking_user: "você está falando",
  thinking: "pensando...",
  speaking_ai: "respondendo",
};

const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");
const label = document.getElementById("label");
const disconnectedBanner = document.getElementById("disconnected-banner");

let targetAmplitude = 0.0;
let displayAmplitude = 0.0;
let currentState = "listening";
let breathePhase = 0;

function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  const { width, height } = canvas;
  ctx.clearRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const color = STATE_COLORS[currentState] || STATE_COLORS.listening;

  // suaviza a amplitude exibida (o WebSocket manda em ~25Hz, isso deixa fluido)
  displayAmplitude = lerp(displayAmplitude, targetAmplitude, 0.15);

  // "respiração" contínua mesmo sem amplitude real (ex: durante thinking/speaking_ai simulados)
  breathePhase += currentState === "thinking" ? 0.18 : 0.05;
  const breathe = (Math.sin(breathePhase) + 1) / 2; // 0..1

  const baseRadius = 70;
  const amplitudeBoost = displayAmplitude * 60;
  const breatheBoost = breathe * 12;
  const radius = baseRadius + amplitudeBoost + breatheBoost;

  const glowRadius = radius * 1.8;
  const gradient = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, glowRadius);
  gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.9)`);
  gradient.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, 0.25)`);
  gradient.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.55, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function connect() {
  const proto = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${window.location.host}/ws`);

  ws.onopen = () => {
    disconnectedBanner.classList.remove("show");
    label.classList.add("connected");
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    currentState = data.state;
    targetAmplitude = data.amplitude;
    label.textContent = STATE_LABELS[data.state] || data.state;
  };

  ws.onclose = () => {
    disconnectedBanner.classList.add("show");
    label.classList.remove("connected");
    label.textContent = "desconectado";
    setTimeout(connect, 1500);
  };

  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
